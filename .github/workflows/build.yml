name: Build RnCS r11.5 (global)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 不使用 android-actions/setup-android（已停止维护，会直接失败）
      - name: Configure Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
          echo "Android SDK: $SDK"
          SDKMGR="$(find "$SDK" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMGR" ]; then
            mkdir -p "$SDK/cmdline-tools"
            curl -sSLo /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "sdk.dir=$SDK" > local.properties

      # r11.5 的 debug 签名指向 signing.RnCS.* 属性，这里现场生成一个调试用 keystore
      # 注意：app/build.gradle 里用 file("debug.jks") 是相对 app 模块解析的，
      # 所以 keystore 必须放在 app/ 目录下，放根目录会报 "Keystore file not found"
      - name: Prepare signing
        run: |
          keytool -genkeypair -v -keystore app/debug.jks -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          {
            echo "signing.RnCS.file=debug.jks"
            echo "signing.RnCS.password=android"
            echo "signing.RnCS.keyAlias=androiddebugkey"
            echo "signing.RnCS.keyPassword=android"
          } >> gradle.properties

      - name: Build globalDebug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleGlobalDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RnCS-global-debug
          path: app/build/outputs/apk/global/debug/*.apk
          if-no-files-found: error
